name: .NET Desktop

on:
  push:
    branches: [ develop ]

  pull_request:
    branches: [ develop ]

jobs:
  Build:

    runs-on: windows-latest

    strategy:
      matrix:
        configuration: [
            Release
        ]
        solution: [
            src/Skylark.slnx,
            src/Skylark.DNS.slnx,
            # src/Skylark.Wing.slnx,
            src/Skylark.Uptime.slnx,
            src/Skylark.Standard.slnx,
            src/Skylark.Clipboard.slnx,
            demo/Skylark.Console.Demo/ConsoleDemoJs/ConsoleDemoJs.slnx,
            demo/Skylark.Console.Demo/ConsoleDemoCss/ConsoleDemoCss.slnx,
            demo/Skylark.Console.Demo/ConsoleDemoTax/ConsoleDemoTax.slnx,
            demo/Skylark.Console.Demo/ConsoleDemoUrl/ConsoleDemoUrl.slnx,
            demo/Skylark.Console.Demo/ConsoleDemoWeb/ConsoleDemoWeb.slnx,
            demo/Skylark.Console.Demo/ConsoleDemoXml/ConsoleDemoXml.slnx,
            demo/Skylark.Console.Demo/ConsoleDemoHash/ConsoleDemoHash.slnx,
            demo/Skylark.Console.Demo/ConsoleDemoWord/ConsoleDemoWord.slnx,
            demo/Skylark.Console.Demo/ConsoleDemoJson/ConsoleDemoJson.slnx,
            demo/Skylark.Console.Demo/ConsoleDemoHtml/ConsoleDemoHtml.slnx,
            demo/Skylark.Console.Demo/ConsoleDemoPing/ConsoleDemoPing.slnx,
            demo/Skylark.Console.Demo/ConsoleDemoPort/ConsoleDemoPort.slnx,
            demo/Skylark.Console.Demo/ConsoleDemoText/ConsoleDemoText.slnx,
            demo/Skylark.Console.Demo/ConsoleDemoTime/ConsoleDemoTime.slnx,
            demo/Skylark.Console.Demo/ConsoleDemoSpeed/ConsoleDemoSpeed.slnx,
            demo/Skylark.Console.Demo/ConsoleDemoColor/ConsoleDemoColor.slnx,
            demo/Skylark.Console.Demo/ConsoleDemoXhtml/ConsoleDemoXhtml.slnx,
            demo/Skylark.Console.Demo/ConsoleDemoHelper/ConsoleDemoHelper.slnx,
            demo/Skylark.Console.Demo/ConsoleDemoUnicode/ConsoleDemoUnicode.slnx,
            demo/Skylark.Console.Demo/ConsoleDemoLottery/ConsoleDemoLottery.slnx,
            demo/Skylark.Console.Demo/ConsoleDemoStorage/ConsoleDemoStorage.slnx,
            demo/Skylark.Console.Demo/ConsoleDemoPassword/ConsoleDemoPassword.slnx,
            demo/Skylark.Console.Demo/ConsoleDemoCryptology/ConsoleDemoCryptology.slnx,
            demo/Skylark.Console.Demo/ConsoleDemoTypography/ConsoleDemoTypography.slnx,
            demo/Skylark.Console.Demo/ConsoleDemoTemperature/ConsoleDemoTemperature.slnx
        ]

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    # Install the .NET Core workload
    - name: Install .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
        dotnet-quality: preview

    # Add  MSBuild to the PATH: https://github.com/microsoft/setup-msbuild
    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2.0.0

    # Execute all unit tests in the solution
    - name: Execute Unit Tests
      run: dotnet test ${{ matrix.solution }} -c ${{ matrix.configuration }} /nowarn:CS0067,CS0108,CS0109,CS0114,CS0169,CS0414,CS0649,CA1416,NU5104,NETSDK1138,SYSLIB0003
      env:
        NUGET_CONFIG_PATH: ./NuGet.Config

    # Restore the application to populate the obj folder with RuntimeIdentifiers
    - name: Restore the Skylark
      run: msbuild ${{ matrix.solution }} /t:Restore /p:Configuration=$env:Configuration
      env:
        NUGET_CONFIG_PATH: ./NuGet.Config
        Configuration: ${{ matrix.configuration }}